services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poke_mmo
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poke_mmo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:local-development-only@database:5432/poke_mmo
      DATABASE_MIGRATION_URL: postgresql://postgres:local-development-only@database:5432/poke_mmo
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/main.js"]
    ports:
      - "3000:8080"
      - "7778:7778"

volumes:
  postgres-data:
